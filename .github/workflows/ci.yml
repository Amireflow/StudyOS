name: Amireflow Study OS — CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Python 3.12 · Alembic · Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations & verify reversibility
        run: |
          python -m alembic upgrade head
          python -c "from pathlib import Path; from alembic import command; from alembic.config import Config; import tempfile; tmp=Path(tempfile.mkdtemp()); cfg=Config('alembic.ini'); cfg.set_main_option('sqlalchemy.url', f'sqlite:///{(tmp / \"rev.db\").as_posix()}'); command.upgrade(cfg, 'head'); command.downgrade(cfg, 'base'); command.upgrade(cfg, 'head')"

      - name: Run Pytest suite (Unit, Integration & E2E-01..04)
        run: python -m pytest -v

  frontend:
    name: Frontend (Node 22 · Typecheck · Vitest · Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Run Vitest unit & E2E acceptance suite
        run: npm run test

      - name: Build production bundle
        run: npm run build
