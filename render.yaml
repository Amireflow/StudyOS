# Render Blueprint — Service Web unifié Amireflow Study OS (Frontend SPA + Backend FastAPI + OCR)
services:
  - type: web
    name: amireflow-study-os
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOW_LOCAL_DEV_AUTH
        value: "false"
      - key: ALLOW_INSECURE_LOCAL_AI_URL
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      # Clé AES-256-GCM 32 octets pour chiffrer les clés API IA utilisateurs :
      # python -c "import secrets; print('k1:' + secrets.token_hex(32))"
      - key: AI_KEY_ENCRYPTION_KEY
        sync: false
      - key: AI_KEY_ENCRYPTION_FALLBACK_KEYS
        sync: false
      # Même origine que l'API sur ce service unifié : SameSite=Lax HttpOnly Secure fonctionne nativement
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      # Render sort en IPv4 : avec Supabase, utilisez le Session/Transaction Pooler (*.pooler.supabase.com)
      - key: DATABASE_URL
        sync: false
      - key: AUTH_JWKS_URL
        value: https://rzjjcqmsepxtpmqwzwmf.supabase.co/auth/v1/.well-known/jwks.json
      - key: AUTH_ISSUER
        value: https://rzjjcqmsepxtpmqwzwmf.supabase.co/auth/v1
      - key: AUTH_AUDIENCE
        value: authenticated
      # Optionnel : RENDER_EXTERNAL_URL est autorisé automatiquement ; renseignez seulement pour un domaine personnalisé
      - key: FRONTEND_ORIGIN
        value: ""
      - key: DEFAULT_TIMEZONE
        value: Africa/Dakar
      - key: AI_PROVIDER
        value: local
      - key: AI_MODEL
        value: local-coach-v1
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
